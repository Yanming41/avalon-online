<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14121c">
<title>阿瓦隆 · 在线助手</title>
<style>
:root{--bg:#14121c;--card:#221f2e;--line:#3a3550;--gold:#e0b45a;--good:#4f8fe8;--evil:#d9534f;--ok:#3fa565;--txt:#ece8f5;--mute:#9a93ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -20%,#2c2540,var(--bg) 60%) fixed;color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:10px 12px 90px}
h1{font-family:serif;color:var(--gold);text-align:center;letter-spacing:6px;margin:16px 0 4px}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding:6px 2px}
.top b{color:var(--gold)}.top .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.top .dot.off{background:var(--evil)}
.top .sp{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#16141f;color:var(--txt);font-size:16px;margin:5px 0}
button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:var(--gold);color:#241b06;margin:5px 0;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.sec{background:#34304a;color:var(--txt)}button.good{background:var(--good);color:#fff}button.evil{background:var(--evil);color:#fff}button.okb{background:var(--ok);color:#fff}
button.sm{width:auto;padding:7px 11px;font-size:13px;margin:3px 2px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
.players{display:flex;flex-direction:column;gap:6px}
.p{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#1a1825;border:2px solid transparent;transition:background .15s}
.p.sel{border-color:var(--gold);background:#2b2615}.p.off{opacity:.45}.p.speak{border-color:var(--ok)}
.av{font-size:24px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#2c2840;border-radius:50%;flex:none;position:relative}
.av .seat{position:absolute;bottom:-4px;right:-4px;font-size:10px;background:#000a;border-radius:8px;padding:0 4px;color:var(--mute)}
.p .tags{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#34304a;white-space:nowrap}
.tag.lead{background:var(--gold);color:#241b06}.tag.team{background:#2f5d3a}.tag.evil{background:var(--evil)}.tag.good{background:var(--good)}.tag.ok{background:var(--ok)}
.quests{display:flex;justify-content:space-between;gap:6px}
.q{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.q small{font-size:10px;font-weight:400;color:var(--mute)}
.q.cur{border-color:var(--gold);box-shadow:0 0 12px #e0b45a55}.q.ok{background:var(--good);border-color:var(--good)}.q.fail{background:var(--evil);border-color:var(--evil)}
.q.ok small,.q.fail small{color:#fffc}
.rej{display:flex;gap:6px;justify-content:center;margin-top:8px;align-items:center;font-size:12px;color:var(--mute)}.rej i{width:13px;height:13px;border-radius:50%;border:1px solid var(--mute)}.rej i.on{background:var(--evil);border-color:var(--evil)}
.role{min-height:200px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:repeating-linear-gradient(45deg,#272238,#272238 10px,#2d2842 10px,#2d2842 20px);border:2px solid var(--gold);text-align:center;padding:12px}
.role.show.g{background:linear-gradient(160deg,#1d3560,#122040)}.role.show.e{background:linear-gradient(160deg,#5e1d1d,#2e0f0f)}
.role .emo{font-size:56px}.role .nm{font-size:26px;font-weight:800;font-family:serif;margin:4px 0}
.mute{color:var(--mute);font-size:13px}.center{text-align:center}
.banner{padding:11px;border-radius:12px;text-align:center;font-weight:700;margin:10px 0;background:#2b2615;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--evil);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90vw}
label.ck{display:flex;align-items:center;gap:8px;padding:5px 0}label.ck input{width:auto;margin:0}
details summary{cursor:pointer;color:var(--gold)}
.code{font-size:40px;letter-spacing:10px;text-align:center;font-weight:800;color:var(--gold)}
.rules p,.rules li{font-size:14px;line-height:1.6}
.avpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.avpick span{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1a1825;border:2px solid transparent;cursor:pointer}
.avpick span.on{border-color:var(--gold);background:#2b2615}
/* 票型表 */
.mx{overflow-x:auto}.mx table{border-collapse:collapse;font-size:13px;min-width:100%}
.mx th,.mx td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx th{color:var(--mute);font-weight:400;font-size:11px}.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx td.tm{background:#2f5d3a55}.mx .y{color:#7ee09b}.mx .n{color:#ff8a85}.mx th.ok{color:var(--ok)}.mx th.no{color:var(--evil)}
/* 发言计时 */
.speech{display:flex;align-items:center;gap:10px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:72px;text-align:center}
.timer.warn{color:var(--evil);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.bar{height:6px;border-radius:3px;background:#34304a;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
/* 弹窗 */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fade .2s}
.modal .box{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
@keyframes fade{from{opacity:0}}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.qc{width:54px;height:76px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;animation:flip .5s backwards}
.qc.s{background:var(--good)}.qc.f{background:var(--evil)}
@keyframes flip{from{transform:rotateY(90deg)}}
.vcol{display:flex;gap:10px}.vcol>div{flex:1;background:#1a1825;border-radius:10px;padding:8px}
.vcol h4{margin:0 0 6px;font-size:14px}
.god{border-color:#a06bff}.god h3{color:#c9a6ff}
.guide li{font-size:13px;line-height:1.6;margin:2px 0}
.av[data-av]{cursor:pointer;border:2px solid transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.av.mk-good{border-color:var(--good);box-shadow:0 0 8px var(--good)}.av.mk-evil{border-color:var(--evil);box-shadow:0 0 8px var(--evil)}.av.mk-merlin{border-color:#c9a6ff;box-shadow:0 0 8px #c9a6ff}.av.mk-unsure{border-color:var(--mute)}
.av .mkb{position:absolute;top:-6px;left:-6px;font-size:12px;line-height:1}
.av.linking{animation:pulse .8s infinite;border-color:var(--gold)}
.rel{font-size:11px;padding:1px 6px;border-radius:10px;background:#2c2840;margin-right:3px;white-space:nowrap}
.rel.same{color:#7ee09b}.rel.opp{color:#ff8a85}
.linkbar{position:sticky;top:0;z-index:10;background:var(--gold);color:#241b06;padding:9px;border-radius:10px;text-align:center;font-weight:700;margin:6px 0}
.mx td.mgood{color:#9cc3ff}.mx td.mevil{color:#ff8a85}.mx td.mmerlin{color:#c9a6ff}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="roles.js"></script>
<script src="app.js"></script>
</body>
</html>
