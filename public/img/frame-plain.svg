<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" preserveAspectRatio="none">
  <!-- 身份卡框：金色双线边框 + 四角花饰 + 底部名牌 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc93"/><stop offset=".35" stop-color="#c9973b"/>
      <stop offset=".6" stop-color="#f1d184"/><stop offset="1" stop-color="#8a6322"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2810" stop-opacity=".92"/><stop offset="1" stop-color="#140c04" stop-opacity=".96"/>
    </linearGradient>
    <g id="corner" fill="none" stroke="url(#g)" stroke-linecap="round">
      <path d="M4 34 V4 H34" stroke-width="3"/>
      <path d="M10 26 V10 H26" stroke-width="1.2"/>
      <circle cx="10" cy="10" r="2.6" fill="url(#g)" stroke="none"/>
      <path d="M34 4 q8 0 10 6" stroke-width="1.4"/>
      <path d="M4 34 q0 8 6 10" stroke-width="1.4"/>
      <path d="M16 4 q2 5 -2 8 M4 16 q5 2 8 -2" stroke-width="1"/>
    </g>
  </defs>
  <!-- 外框 / 内框 -->
  <rect x="1.5" y="1.5" width="197" height="297" fill="none" stroke="#1a1006" stroke-width="3"/>
  <rect x="3" y="3" width="194" height="294" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <rect x="7.5" y="7.5" width="185" height="285" fill="none" stroke="url(#g)" stroke-width=".8" opacity=".85"/>
  <!-- 四角 -->
  <use href="#corner"/>
  <use href="#corner" transform="translate(200 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 300) scale(1 -1)"/>
  <use href="#corner" transform="translate(200 300) scale(-1 -1)"/>
  <!-- 顶部小宝石 -->
  <path d="M100 2 l6 6 -6 6 -6 -6 z" fill="url(#g)" stroke="#1a1006" stroke-width=".8"/>
  <circle cx="100" cy="8" r="2" fill="#7a1d1a"/>
</svg>
