# 防止 Supabase 免费项目因为一周没人用被暂停：每 3 天真正查一次数据库
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里加两个 secret：
#   SUPABASE_URL       例如 https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  公开 key（publishable / anon）
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 */3 * *' # 每 3 天一次（UTC 时间）
  workflow_dispatch: {}     # 也可以在 Actions 页面手动运行

permissions:
  actions: write # 用来给自己"续命"：公开仓库 60 天没动静时 GitHub 会停掉定时任务

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::没有设置 SUPABASE_URL / SUPABASE_ANON_KEY secret，跳过"; exit 0
          fi
          # 真正读一行数据（只打 health 接口不一定算"数据库活动"）
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"; head -c 200 body.txt; echo
          if [ "$code" != "200" ]; then echo "::error::Supabase 没有正常响应（项目可能已经被暂停，去后台点 Restore）"; exit 1; fi
      - name: Keep this schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" || true
